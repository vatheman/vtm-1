              setAuthMsg({ type: '', text: '' });

              password: signUpPassword,

                  phone_number: signUpPhone,
                  agree_marketing: agreeMarketing,

                            className="w-3.5 h-3.5 text-[#0B318F] rounded"
                          />
                          <span><strong className="text-[#0B318F]">[필수]</strong> 이용약관 동의</span>
                        </label>
                        <button
                          type="button"
                          onClick={() => setShowTermsDetail(showTermsDetail === 'terms' ? null : 'terms')}
                          className="text-[11px] text-gray-400 underline"
                        >
                          내용보기
                        </button>
                      </div>

                      <div className="flex items-center justify-between text-xs px-1">
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input
                            type="checkbox"
                            required
                            checked={agreePrivacy}
                            onChange={(e) => setAgreePrivacy(e.target.checked)}
                            className="w-3.5 h-3.5 text-[#0B318F] rounded"
                          />
                          <span><strong className="text-[#0B318F]">[필수]</strong> 개인정보 수집 및 이용 동의</span>
                        </label>
                        <button
                          type="button"
                          onClick={() => setShowTermsDetail(showTermsDetail === 'privacy' ? null : 'privacy')}
                          className="text-[11px] text-gray-400 underline"
                        >
                          내용보기
                        </button>
                      </div>

                      {/* Optional Marketing Agreement */}
                      <div className="px-1 space-y-1 pt-1">
                        <label className="flex items-center gap-2 cursor-pointer text-xs">
                          <input
                            type="checkbox"
                            checked={agreeMarketing}
                            onChange={(e) => setAgreeMarketing(e.target.checked)}
                            className="w-3.5 h-3.5 text-[#0B318F] rounded"
                          />
                          <span>[선택] 마케팅 정보 수신 동의</span>
                        </label>

                        {agreeMarketing && (
                          <div className="flex gap-3 pl-5 text-[11px] text-[#6E6862]">
                            <label className="flex items-center gap-1 cursor-pointer">
                              <input type="checkbox" checked={mktSms} onChange={e=>setMktSms(e.target.checked)} /> SMS
                            </label>
                            <label className="flex items-center gap-1 cursor-pointer">
                              <input type="checkbox" checked={mktEmail} onChange={e=>setMktEmail(e.target.checked)} /> 이메일
                            </label>
                            <label className="flex items-center gap-1 cursor-pointer">
                              <input type="checkbox" checked={mktKakao} onChange={e=>setMktKakao(e.target.checked)} /> 카카오 알림톡
                            </label>
                          </div>
                        )}
                      </div>

                      {showTermsDetail && (
                        <div className="p-2.5 bg-[#FAF6F0] rounded-xl border text-[11px] text-[#6E6862] leading-relaxed max-h-24 overflow-y-auto">
                          {showTermsDetail === 'terms' ? (
                            <p><strong>[이용약관]</strong> 바더만 자사몰 회원 이용 규정 및 오가닉 텐실 스카프 배송 규정을 준수합니다.</p>
                          ) : (
                            <p><strong>[개인정보 수집 동의]</strong> 수집 항목: 이메일, 성명, 연락처. 보유 기간: 회원 탈퇴 시 즉시 파기.</p>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Sign Up Submit Button - Enabled ONLY when isSignUpFormValid */}
                    <button
                      type="submit"
                      disabled={!isSignUpFormValid || authLoading}
                      className={`w-full py-3.5 rounded-xl font-bold text-xs shadow-md transition-all ${
                        isSignUpFormValid && !authLoading
                          ? 'bg-[#0B318F] hover:bg-[#082672] text-white shadow-lg cursor-pointer'
                          : 'bg-gray-200 text-gray-400 cursor-not-allowed border border-gray-300'
                      }`}
                    >
                      {authLoading ? '회원가입 처리 중...' : '바더만 회원가입 완료하기'}
                    </button>

                    <div className="text-center pt-2 border-t border-[#E8DFD5]">
                      <span className="text-xs text-[#6E6862]">
                        이미 계정이 있으신가요?{' '}
                        <button
                          type="button"
                          onClick={() => { setAuthMode('login'); setAuthMsg({ type: '', text: '' }); }}
                          className="text-[#0B318F] font-bold underline ml-1"
                        >
                          로그인
                        </button>
                      </span>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Footer matching vatheman.com */}
          <footer className="bg-[#F7F2E9] text-[#424242] py-12 text-xs border-t text-left">
            <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8">
              <div>
                <div className="h-10 overflow-hidden relative flex items-center mb-2 w-32">
                  <img 
                    src="/assets/images/logo-blue.png" 
                    alt="VATHEMAN" 
                    className="h-[170%] w-auto object-cover object-top" 
                    style={{ mixBlendMode: 'multiply' }}
                  />
                </div>
                <p className="text-[#6E6862] mt-1 font-light">{BRAND_INFO.slogan}</p>
                <p className="text-[#6E6862] text-[11px] mt-2">{BRAND_INFO.address}</p>
              </div>
              <div>
                <p className="font-bold text-[#2C2825] mb-2">고객센터 & 문의</p>
                <p className="text-base font-bold text-[#0B318F] font-serif">{BRAND_INFO.csPhone}</p>
                <p className="text-[#6E6862] mt-1">평일 10:00 - 18:00 (주말/공휴일 휴무)</p>
              </div>
              <div>
                <p className="font-bold text-[#2C2825] mb-2">공식 SNS 채널</p>
                <div className="space-y-1">
                  <p><a href={BRAND_INFO.smartstoreUrl} target="_blank" className="text-[#03C75A] font-bold">네이버 스마트스토어 ↗</a></p>
                  <p><a href={BRAND_INFO.instagramUrl} target="_blank" className="text-[#E1306C] font-bold">인스타그램 (@vatheman_) ↗</a></p>
                  <p><a href={BRAND_INFO.youtubeUrl} target="_blank" className="text-[#FF0000] font-bold">유튜브 공식 채널 ↗</a></p>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
