                </p>
                <div className="flex gap-4">
                  <a href="#shop" className="px-7 py-3.5 bg-[#0B318F] text-white rounded-xl font-bold text-xs shadow-md">
                    천연염색 스카프 컬렉션
                  </a>
                  <a href={BRAND_INFO.smartstoreUrl} target="_blank" className="px-6 py-3.5 bg-white border text-[#2C2825] rounded-xl font-bold text-xs">
                    네이버 스마트스토어 ↗
                  </a>
                </div>
              </div>
              <div className="rounded-2xl overflow-hidden shadow-2xl border-4 border-white">
                <img src="./public/assets/images/hero.png" alt="바더만 히어로" className="w-full h-[450px] object-cover" />
              </div>
            </div>
          </section>

          {/* ABOUT Section */}
          <section id="about" className="py-20 bg-[#FDFBF7] border-b border-[#E8DFD5]">
            <div className="max-w-7xl mx-auto px-6 text-center">
              <span className="text-xs font-bold text-[#0B318F] uppercase tracking-widest block mb-2">ABOUT VATHEMAN</span>
              <h2 className="text-3xl font-bold font-serif text-[#2C2825] mb-4">자연이 건넨 깊은 빛깔, 사람의 정성</h2>
              <p className="text-xs text-[#6E6862] max-w-xl mx-auto mb-12">
                바더만은 경기도일자리재단 입주 아틀리에에서 100% 자연염재로 수작업 염색을 수행합니다.
              </p>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                <div className="warm-card p-6 bg-white">
                  <h3 className="font-bold text-base text-[#0B318F] mb-2">100% 텐실(Tencel) 소재</h3>
                  <p className="text-xs text-[#6E6862]">피부에 미끄러지듯 부드럽고 실크보다 관리가 용이한 고급 오가닉 텐실 소재입니다.</p>
                </div>
                <div className="warm-card p-6 bg-white">
                  <h3 className="font-bold text-base text-[#0B318F] mb-2">풋감·쪽·쑥·황토 염재</h3>
                  <p className="text-xs text-[#6E6862]">청정 자연에서 수확한 천연 염재만 사용하여 항균성과 차분한 발색을 안겨줍니다.</p>
                </div>
                <div className="warm-card p-6 bg-white">
                  <h3 className="font-bold text-base text-[#0B318F] mb-2">바른 가치의 선물</h3>
                  <p className="text-xs text-[#6E6862]">소중한 분께 감사의 마음을 담아 정성껏 마감하고 포장하여 전해드립니다.</p>
                </div>
              </div>
            </div>
          </section>

          {/* SHOP Section */}
          <section id="shop" className="py-20 bg-[#FAF6F0] border-b border-[#E8DFD5]">
            <div className="max-w-7xl mx-auto px-6 text-left">
              <h2 className="text-3xl font-bold font-serif mb-6 text-center text-[#2C2825]">바더만 SHOP 라인업</h2>
              
              <div className="flex gap-2 justify-center mb-10">
                {['전체', '롱텐실', '사각텐실'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setShopTab(tab)}
                    className={`px-5 py-2 rounded-full text-xs font-bold transition-all ${shopTab === tab ? 'bg-[#0B318F] text-white shadow-sm' : 'bg-white text-[#6E6862] border'}`}
                  >
                    {tab}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                {filteredProducts.map(p => (
                  <div key={p.id} className="warm-card overflow-hidden bg-white">
                    <img src={p.image} alt={p.name} className="w-full h-64 object-cover" />
                    <div className="p-5">
                      <span className="text-[11px] font-bold text-[#0B318F]">{p.dyeType}</span>
                      <h3 className="text-sm font-bold text-[#2C2825] my-1">{p.name}</h3>
                      <p className="text-xs text-[#6E6862] mb-4 font-light">{p.description}</p>
                      <div className="flex justify-between items-center pt-3 border-t">
                        <span className="font-serif font-bold text-lg text-[#2C2825]">{p.price.toLocaleString()}원</span>
                        <a href={BRAND_INFO.smartstoreUrl} target="_blank" className="px-3.5 py-1.5 bg-[#0B318F] text-white rounded-lg text-xs font-bold">스마트스토어 구매 ↗</a>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FAQ Section */}
          <section id="faq" className="py-16 bg-[#FDFBF7] border-b border-[#E8DFD5]">
            <div className="max-w-4xl mx-auto px-6 text-left">
              <h2 className="text-2xl font-bold font-serif mb-6 text-center">자주 묻는 질문 (FAQ)</h2>
              <div className="space-y-3 text-xs">
                <div className="p-4 bg-white rounded-xl border">
                  <p className="font-bold text-[#0B318F] mb-1">Q. 천연염색 제품 세탁 및 관리법은 어떻게 되나요?</p>
                  <p className="text-[#6E6862]">미온수에 중성세제를 사용하여 가볍게 단독 손세탁 해주시고, 그늘에서 자연 건조해주시면 됩니다.</p>
                </div>
                <div className="p-4 bg-white rounded-xl border">
                  <p className="font-bold text-[#0B318F] mb-1">Q. 배송비 조건이 어떻게 되나요?</p>
                  <p className="text-[#6E6862]">70,000원 이상 구매 시 무료배송(기본 배송비 3,500원)이며 주문 후 1~3일 이내 출고됩니다.</p>
                </div>
              </div>
            </div>
          </section>

          {/* Auth Modal */}
          {isAuthOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-8 max-w-sm w-full text-center relative border border-[#E8DFD5]">
                <button onClick={() => setIsAuthOpen(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                <div className="h-10 overflow-hidden relative flex items-center justify-center mb-2 mx-auto w-32">
                  <img 
                    src="/assets/images/logo-blue.png" 
                    alt="VATHEMAN" 
                    className="h-[170%] w-auto object-cover object-top" 
                    style={{ mixBlendMode: 'multiply' }}
                  />
                </div>
                <span className="text-xs text-[#D0B579] font-bold block mb-4">Supabase Auth 연동 준비단계</span>
                <p className="text-xs text-[#6E6862] mb-6">로그인 및 회원가입 버튼 UI입니다. 수파베이스 백엔드 연결 준비가 완료되었습니다.</p>
                <button onClick={() => alert("수파베이스 백엔드 로그인 연동 대기중")} className="w-full py-3 bg-[#0B318F] text-white font-bold rounded-xl text-xs shadow-md">
                  로그인 / 회원가입 실행 (Supabase Ready)
                </button>
              </div>
            </div>
          )}

          {/* Footer matching vatheman.com */}
          <footer className="bg-[#F7F2E9] text-[#424242] py-12 text-xs border-t text-left">
            <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8">
              <div>
                <div className="h-10 overflow-hidden relative flex items-center mb-2 w-32">
                  <img 
                    src="/assets/images/logo-blue.png" 
                    alt="VATHEMAN" 
                    className="h-[170%] w-auto object-cover object-top" 
                    style={{ mixBlendMode: 'multiply' }}
                  />
                </div>
                <p className="text-[#6E6862] mt-1 font-light">{BRAND_INFO.slogan}</p>
                <p className="text-[#6E6862] text-[11px] mt-2">{BRAND_INFO.address}</p>
              </div>
              <div>
                <p className="font-bold text-[#2C2825] mb-2">고객센터 & 문의</p>
                <p className="text-base font-bold text-[#0B318F] font-serif">{BRAND_INFO.csPhone}</p>
                <p className="text-[#6E6862] mt-1">평일 10:00 - 18:00 (주말/공휴일 휴무)</p>
              </div>
              <div>
                <p className="font-bold text-[#2C2825] mb-2">공식 SNS 채널</p>
                <div className="space-y-1">
                  <p><a href={BRAND_INFO.smartstoreUrl} target="_blank" className="text-[#03C75A] font-bold">네이버 스마트스토어 ↗</a></p>
                  <p><a href={BRAND_INFO.instagramUrl} target="_blank" className="text-[#E1306C] font-bold">인스타그램 (@vatheman_) ↗</a></p>
                  <p><a href={BRAND_INFO.youtubeUrl} target="_blank" className="text-[#FF0000] font-bold">유튜브 공식 채널 ↗</a></p>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
